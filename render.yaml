services:
  - type: web
    name: accessforge-api
    runtime: docker
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    # This API is the single migration owner. The independently deployed
    # worker and scheduler below perform a read-only head check before startup.
    preDeployCommand: alembic upgrade head
    plan: starter
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_DB
        value: 'false'
      - key: DATABASE_URL
        fromDatabase: { name: accessforge-postgres, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: accessforge-redis, property: connectionString }
      - key: CORS_ORIGINS
        sync: false
      - key: BACKEND_TOKEN_PUBLIC_KEYS_JSON
        sync: false
      - key: MODEL_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      # Phase 6 stays unavailable until an independently reviewed operational
      # release. These values do not make an output safe or physically usable.
      - key: RISK_CONTEXT_ENCRYPTION_KEY
        sync: false
      - key: PHASE6_CONTROLLED_VALIDATION_ENABLED
        value: 'false'
      - key: PHASE6_EXPORT_ENABLED
        value: 'false'
      - key: PHASE6_REVIEWER_ROLES
        value: safety_reviewer
      # AI is off unless a provider configuration is selected. Keep all managed
      # provider secrets in Render; never mirror them into Vercel.
      - key: DEFAULT_MODEL_PROVIDER
        value: none
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_API_BASE
        value: https://api.deepseek.com
      - key: DEEPSEEK_FAST_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_REASONING_MODEL
        value: deepseek-v4-pro
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        value: https://api.openai.com/v1
      - key: OPENAI_FAST_MODEL
        sync: false
      - key: OPENAI_REASONING_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_FAST_MODEL
        sync: false
      - key: ANTHROPIC_REASONING_MODEL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_FAST_MODEL
        sync: false
      - key: GOOGLE_REASONING_MODEL
        sync: false
      - key: CUSTOM_MODEL_ENDPOINT_ALLOWLIST
        sync: false
      # Keep hosted deployments fail-closed for custom endpoints.
      - key: ALLOW_UNSAFE_CUSTOM_MODEL_ENDPOINTS
        value: 'false'
      - key: MODEL_PROVIDER_TIMEOUT_SECONDS
        value: '20'
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET_PRIVATE
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
  - type: worker
    name: accessforge-worker
    runtime: docker
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    # The API is the single migration owner. This worker performs a read-only
    # head check and refuses to start if that independently deployed migration
    # has not completed; it never races the API by running DDL itself.
    dockerCommand: /bin/sh -c 'python -m accessforge.db.schema_gate && celery -A accessforge.jobs.celery_app worker --loglevel=INFO'
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: accessforge-postgres, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: accessforge-redis, property: connectionString }
      - key: BACKEND_TOKEN_PUBLIC_KEYS_JSON
        sync: false
      - key: MODEL_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: RISK_CONTEXT_ENCRYPTION_KEY
        sync: false
      - key: PHASE6_CONTROLLED_VALIDATION_ENABLED
        value: 'false'
      - key: PHASE6_EXPORT_ENABLED
        value: 'false'
      - key: PHASE6_REVIEWER_ROLES
        value: safety_reviewer
      # Keep future background AI work behind the same backend-only secret and
      # egress controls as the API service.
      - key: DEFAULT_MODEL_PROVIDER
        value: none
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_API_BASE
        value: https://api.deepseek.com
      - key: DEEPSEEK_FAST_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_REASONING_MODEL
        value: deepseek-v4-pro
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        value: https://api.openai.com/v1
      - key: OPENAI_FAST_MODEL
        sync: false
      - key: OPENAI_REASONING_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_FAST_MODEL
        sync: false
      - key: ANTHROPIC_REASONING_MODEL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_FAST_MODEL
        sync: false
      - key: GOOGLE_REASONING_MODEL
        sync: false
      - key: CUSTOM_MODEL_ENDPOINT_ALLOWLIST
        sync: false
      - key: ALLOW_UNSAFE_CUSTOM_MODEL_ENDPOINTS
        value: 'false'
      - key: MODEL_PROVIDER_TIMEOUT_SECONDS
        value: '20'
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET_PRIVATE
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
  - type: worker
    name: accessforge-scheduler
    runtime: docker
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    # Run one scheduler separately from workers. Its local schedule file is
    # ephemeral; durable retry state is stored in PostgreSQL deletion rows.
    dockerCommand: /bin/sh -c 'python -m accessforge.db.schema_gate && celery -A accessforge.jobs.celery_app beat --loglevel=INFO --schedule=/tmp/accessforge-celerybeat-schedule'
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: accessforge-postgres, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: accessforge-redis, property: connectionString }
  - type: keyvalue
    name: accessforge-redis
    plan: starter
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList:
      - source: 0.0.0.0/0
        description: Render service networking; restrict further when fixed egress ranges are available
databases:
  - name: accessforge-postgres
    plan: starter
