<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">AccessForge printable scale marker</title>
  <desc id="desc">A square black and white fiducial-style marker. Print at actual size.</desc>
  <rect width="160" height="160" fill="white"/>
  <rect x="8" y="8" width="144" height="144" fill="black"/>
  <rect x="24" y="24" width="112" height="112" fill="white"/>
  <rect x="40" y="40" width="80" height="80" fill="black"/>
  <rect x="56" y="56" width="48" height="48" fill="white"/>
  <rect x="68" y="68" width="24" height="24" fill="black"/>
</svg>
