name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
        with: { version: '0.9.18' }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project services/api --locked
      - run: pnpm generate:api
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm format:check
  api:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: '0.9.18' }
      - run: uv sync --project services/api --locked
      - run: uv run --project services/api ruff check services/api
      - run: uv run --project services/api mypy services/api/accessforge
      - run: uv run --project services/api pytest
