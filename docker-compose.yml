services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accessforge
      POSTGRES_USER: accessforge
      POSTGRES_PASSWORD: accessforge
    ports: ['5432:5432']
    volumes: [accessforge-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U accessforge -d accessforge']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: accessforge
      MINIO_ROOT_PASSWORD: accessforge-local-only
    ports: ['9000:9000', '9001:9001']
    volumes: [accessforge-minio:/data]
  api:
    build: { context: ./services/api, dockerfile: Dockerfile }
    environment:
      APP_ENV: development
      AUTO_CREATE_DB: 'true'
      DATABASE_URL: postgresql+asyncpg://accessforge:accessforge@postgres:5432/accessforge
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      BACKEND_TOKEN_ISSUER: accessforge-web
      BACKEND_TOKEN_AUDIENCE: accessforge-api
      BACKEND_TOKEN_PUBLIC_KEYS_JSON: ${BACKEND_TOKEN_PUBLIC_KEYS_JSON:-{}}
      # Optional Phase 3 model-provider boundary. Values come from the gitignored
      # repository-root .env or the shell, never from the browser application.
      DEFAULT_MODEL_PROVIDER: ${DEFAULT_MODEL_PROVIDER:-none}
      MODEL_CREDENTIAL_ENCRYPTION_KEY: ${MODEL_CREDENTIAL_ENCRYPTION_KEY:-}
      # Phase 6 is deliberately off even in the local stack. These settings do
      # not establish safety, physical suitability, or authority to export.
      RISK_CONTEXT_ENCRYPTION_KEY: ${RISK_CONTEXT_ENCRYPTION_KEY:-}
      PHASE6_CONTROLLED_VALIDATION_ENABLED: ${PHASE6_CONTROLLED_VALIDATION_ENABLED:-false}
      PHASE6_EXPORT_ENABLED: ${PHASE6_EXPORT_ENABLED:-false}
      PHASE6_REVIEWER_ROLES: ${PHASE6_REVIEWER_ROLES:-safety_reviewer}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      DEEPSEEK_FAST_MODEL: ${DEEPSEEK_FAST_MODEL:-deepseek-v4-flash}
      DEEPSEEK_REASONING_MODEL: ${DEEPSEEK_REASONING_MODEL:-deepseek-v4-pro}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENAI_FAST_MODEL: ${OPENAI_FAST_MODEL:-}
      OPENAI_REASONING_MODEL: ${OPENAI_REASONING_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_FAST_MODEL: ${ANTHROPIC_FAST_MODEL:-}
      ANTHROPIC_REASONING_MODEL: ${ANTHROPIC_REASONING_MODEL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_FAST_MODEL: ${GOOGLE_FAST_MODEL:-}
      GOOGLE_REASONING_MODEL: ${GOOGLE_REASONING_MODEL:-}
      CUSTOM_MODEL_ENDPOINT_ALLOWLIST: ${CUSTOM_MODEL_ENDPOINT_ALLOWLIST:-}
      ALLOW_UNSAFE_CUSTOM_MODEL_ENDPOINTS: ${ALLOW_UNSAFE_CUSTOM_MODEL_ENDPOINTS:-false}
      MODEL_PROVIDER_TIMEOUT_SECONDS: ${MODEL_PROVIDER_TIMEOUT_SECONDS:-20}
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET_PRIVATE: accessforge-private
      S3_ACCESS_KEY_ID: accessforge
      S3_SECRET_ACCESS_KEY: accessforge-local-only
    ports: ['8000:10000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:10000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: { context: ./services/api, dockerfile: Dockerfile }
    command: celery -A accessforge.jobs.celery_app worker --loglevel=INFO
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://accessforge:accessforge@postgres:5432/accessforge
      REDIS_URL: redis://redis:6379/0
      # Keep future background AI work on the same backend-only configuration
      # boundary as the API. The offline fake adapter is development-only.
      DEFAULT_MODEL_PROVIDER: ${DEFAULT_MODEL_PROVIDER:-none}
      MODEL_CREDENTIAL_ENCRYPTION_KEY: ${MODEL_CREDENTIAL_ENCRYPTION_KEY:-}
      RISK_CONTEXT_ENCRYPTION_KEY: ${RISK_CONTEXT_ENCRYPTION_KEY:-}
      PHASE6_CONTROLLED_VALIDATION_ENABLED: ${PHASE6_CONTROLLED_VALIDATION_ENABLED:-false}
      PHASE6_EXPORT_ENABLED: ${PHASE6_EXPORT_ENABLED:-false}
      PHASE6_REVIEWER_ROLES: ${PHASE6_REVIEWER_ROLES:-safety_reviewer}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      DEEPSEEK_FAST_MODEL: ${DEEPSEEK_FAST_MODEL:-deepseek-v4-flash}
      DEEPSEEK_REASONING_MODEL: ${DEEPSEEK_REASONING_MODEL:-deepseek-v4-pro}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENAI_FAST_MODEL: ${OPENAI_FAST_MODEL:-}
      OPENAI_REASONING_MODEL: ${OPENAI_REASONING_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_FAST_MODEL: ${ANTHROPIC_FAST_MODEL:-}
      ANTHROPIC_REASONING_MODEL: ${ANTHROPIC_REASONING_MODEL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_FAST_MODEL: ${GOOGLE_FAST_MODEL:-}
      GOOGLE_REASONING_MODEL: ${GOOGLE_REASONING_MODEL:-}
      CUSTOM_MODEL_ENDPOINT_ALLOWLIST: ${CUSTOM_MODEL_ENDPOINT_ALLOWLIST:-}
      ALLOW_UNSAFE_CUSTOM_MODEL_ENDPOINTS: ${ALLOW_UNSAFE_CUSTOM_MODEL_ENDPOINTS:-false}
      MODEL_PROVIDER_TIMEOUT_SECONDS: ${MODEL_PROVIDER_TIMEOUT_SECONDS:-20}
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET_PRIVATE: accessforge-private
      S3_ACCESS_KEY_ID: accessforge
      S3_SECRET_ACCESS_KEY: accessforge-local-only
    depends_on:
      # The API image applies Alembic migrations before serving its health
      # check, so workers do not claim outbox rows before the current schema.
      api: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
  scheduler:
    build: { context: ./services/api, dockerfile: Dockerfile }
    # Keep beat separate from horizontally scalable workers. The schedule file
    # is intentionally ephemeral; durable state belongs in PostgreSQL.
    command: celery -A accessforge.jobs.celery_app beat --loglevel=INFO --schedule=/tmp/accessforge-celerybeat-schedule
    environment:
      APP_ENV: development
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
volumes:
  accessforge-postgres:
  accessforge-minio:
